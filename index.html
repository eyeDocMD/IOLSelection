<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IOL Comparison Tool</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1, h2 { text-align: center; }
    .section { margin-bottom: 20px; }
    .lens-category { margin-bottom: 10px; }
    .lens-option { margin-left: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid black; padding: 8px; text-align: center; }
    .button-group { text-align: center; margin-top: 20px; }
    .button-group button { margin: 5px; padding: 10px 20px; font-size: 16px; }
    #comparisonSection { display: none; }
  </style>
</head>
<body>
  <h1>IOL Comparison Tool</h1>

  <div class="section">
    <h2>Patient Information</h2>
    <label>Name: <input type="text" id="patientName"></label><br><br>
    <label>Date: <input type="date" id="comparisonDate"></label><br><br>
    <label>Region:
      <select id="region">
        <option value="la">Los Angeles</option>
        <option value="oc">Orange County</option>
        <option value="sd">San Diego</option>
        <option value="desert">Desert</option>
      </select>
    </label>
  </div>

  <div class="section">
    <h2>Select 2–4 Lenses</h2>
    <div id="lensOptions"></div>
  </div>

  <div class="section">
    <h2>Add-ons</h2>
    <label><input type="checkbox" id="laser"> Laser</label>
    <label><input type="checkbox" id="ora"> ORA</label>
  </div>

  <div class="button-group">
    <button onclick="generateComparison()">Generate Comparison</button>
  </div>

  <div id="comparisonSection" class="section">
    <h2>Comparison Summary</h2>
    <div id="comparisonTable"></div>
    <div class="button-group">
      <button onclick="downloadPDF()">Download PDF</button>
      <button onclick="window.print()">Print</button>
    </div>
  </div>

  <script>
    const lenses = [
      { name: "Monofocal Lens", type: "Monofocal" },
      { name: "Trifocal Lens", type: "Trifocal" },
      { name: "Extended Depth of Focus Lens", type: "Extended Depth of Focus (EDOF)" },
      { name: "Light Adjustable Lens", type: "Adjustable" },
      { name: "Light Adjustable Lens+", type: "Adjustable" }
    ];

    const basePrices = {
      la: {
        "Monofocal Lens": 1000,
        "Trifocal Lens": 2500,
        "Extended Depth of Focus Lens": 2200,
        "Light Adjustable Lens": 3000,
        "Light Adjustable Lens+": 3200
      }
    };

    // Clone LA prices for other regions (placeholder)
    basePrices.oc = { ...basePrices.la };
    basePrices.sd = { ...basePrices.la };
    basePrices.desert = { ...basePrices.la };

    const categories = {
      "Monofocal": [],
      "Trifocal": [],
      "Extended Depth of Focus (EDOF)": [],
      "Adjustable": []
    };

    lenses.forEach(lens => {
      categories[lens.type].push(lens);
    });

    const lensOptionsDiv = document.getElementById("lensOptions");
    for (const [category, lensList] of Object.entries(categories)) {
      const categoryDiv = document.createElement("div");
      categoryDiv.className = "lens-category";
      categoryDiv.innerHTML = `<strong>${category}</strong>`;
      lensList.forEach(lens => {
        categoryDiv.innerHTML += `
          <div class="lens-option">
            <label>
              <input type="checkbox" name="lens" value="${lens.name}"> ${lens.name}
            </label>
            <label>
              <input type="checkbox" name="recommend-${lens.name}"> Recommend
            </label>
          </div>`;
      });
      lensOptionsDiv.appendChild(categoryDiv);
    }

    function generateComparison() {
      const patientName = document.getElementById("patientName").value;
      const comparisonDate = document.getElementById("comparisonDate").value;
      const region = document.getElementById("region").value;
      const laser = document.getElementById("laser").checked;
      const ora = document.getElementById("ora").checked;
      const checkboxes = document.querySelectorAll('input[name="lens"]:checked');

      if (checkboxes.length < 2 || checkboxes.length > 4) {
        alert("Please select 2 to 4 lenses.");
        return;
      }

      let tableHTML = `<p><strong>Patient:</strong> ${patientName || ""} &nbsp;&nbsp; <strong>Date:</strong> ${comparisonDate || ""}</p>`;
      tableHTML += "<table><thead><tr><th>Feature</th>";

      checkboxes.forEach(cb => {
        tableHTML += `<th>${cb.value}</th>`;
      });
      tableHTML += "</tr></thead><tbody>";

      // Cost Row
      tableHTML += "<tr><td>Cost</td>";
      checkboxes.forEach(cb => {
        const price = basePrices[region][cb.value] || 0;
        tableHTML += `<td>$${price.toLocaleString()}</td>`;
      });
      tableHTML += "</tr>";

      // Recommended Row (optional)
      let recommendedRow = "<tr><td>Recommended</td>";
      let hasRecommendation = false;
      checkboxes.forEach(cb => {
        const recommend = document.querySelector(`input[name="recommend-${cb.value}"]`);
        if (recommend && recommend.checked) {
          recommendedRow += "<td>★ Recommended</td>";
          hasRecommendation = true;
        } else {
          recommendedRow += "<td></td>";
        }
      });
      recommendedRow += "</tr>";
      if (hasRecommendation) {
        tableHTML += recommendedRow;
      }

      // Add-ons Row
      tableHTML += "<tr><td>Other</td>";
      checkboxes.forEach(() => {
        let extras = [];
        if (laser) extras.push("Laser");
        if (ora) extras.push("ORA");
        tableHTML += `<td>${extras.join(" + ") || ""}</td>`;
      });
      tableHTML += "</tr>";

      tableHTML += "</tbody></table>";

      document.getElementById("comparisonTable").innerHTML = tableHTML;
      document.getElementById("comparisonSection").style.display = "block";
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.html(document.getElementById("comparisonTable"), {
        callback: function (doc) {
          doc.save("IOL_Comparison.pdf");
        },
        x: 10,
        y: 10
      });
    }
  </script>
</body>
</html>
