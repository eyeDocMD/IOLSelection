<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IOL Comparison Tool</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h2 { margin-top: 30px; }
    .lens-option { margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: top; }
    th { background-color: #f4f4f4; }
    .btn { padding: 10px 15px; margin: 5px; cursor: pointer; }
    .logo { margin-bottom: 20px; }
    .no-print { margin-top: 20px; }
    @media print {
      .no-print { display: none; }
      body { margin: 0; }
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="logo.png" alt="Acuity Eye Group Logo" width="200">
  </div>

  <h2>Select 2 to 4 Lenses</h2>
  <div id="lensOptions"></div>

  <h2>Recommendation (optional)</h2>
  <div id="recommendOptions"></div>

  <h2>Patient Info</h2>
  <label>Patient Name: <input type="text" id="patientName"></label><br><br>
  <label>Notes:<br><textarea id="patientNotes" rows="3" cols="50"></textarea></label>

  <h2>Region</h2>
  <select id="regionSelect">
    <option value="la">Los Angeles</option>
    <option value="inland">Inland Empire</option>
    <option value="orange">Orange County</option>
  </select>

  <h2>Add-ons</h2>
  <label><input type="checkbox" id="laserAddOn"> Laser (+$1100)</label><br>
  <label><input type="checkbox" id="oraAddOn"> ORA (+$500)</label><br>

  <div class="no-print">
    <button class="btn" onclick="buildComparison()">Generate Comparison</button>
  </div>

  <div id="comparisonContainer"></div>

<script>
const lenses = [
  { name: "Monofocal", type: "Monofocal", exp: "Clear distance vision, glasses for near", pros: "Covered by insurance", cons: "Need glasses for near" },
  { name: "EDOF", type: "Extended Depth", exp: "Good distance & intermediate", pros: "Reduced halo/glare", cons: "May still need readers" },
  { name: "Trifocal", type: "Multifocal", exp: "Distance, intermediate & near", pros: "Spectacle independence", cons: "More halos & glare" },
  { name: "Light Adjustable", type: "Adjustable", exp: "Customized after surgery", pros: "Tailored vision", cons: "Requires UV glasses" }
];

const basePrices = {
  la: { "Monofocal": "$0", "EDOF": "$2,000", "Trifocal": "$3,000", "Light Adjustable": "$4,000" },
  inland: { "Monofocal": "$0", "EDOF": "$1,800", "Trifocal": "$2,800", "Light Adjustable": "$3,800" },
  orange: { "Monofocal": "$0", "EDOF": "$2,200", "Trifocal": "$3,200", "Light Adjustable": "$4,200" }
};

// Build lens selection checkboxes & recommendation radios
window.onload = function() {
  const lensOptions = document.getElementById("lensOptions");
  const recommendOptions = document.getElementById("recommendOptions");

  lenses.forEach(lens => {
    lensOptions.innerHTML += `
      <div class="lens-option">
        <label><input type="checkbox" value="${lens.name}" data-name="${lens.name}"
        data-type="${lens.type}" data-exp="${lens.exp}"
        data-pros="${lens.pros}" data-cons="${lens.cons}"> ${lens.name}</label>
      </div>
    `;
    recommendOptions.innerHTML += `
      <label><input type="radio" name="recommendation" value="${lens.name}"> ${lens.name}</label><br>
    `;
  });
};

function buildComparison() {
  const checkboxes = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'));
  const recommendation = document.querySelector('input[name="recommendation"]:checked');
  const patientName = document.getElementById("patientName").value.trim();
  const notes = document.getElementById("patientNotes").value.trim();
  const region = document.getElementById("regionSelect").value;
  const addLaser = document.getElementById("laserAddOn").checked;
  const addOra = document.getElementById("oraAddOn").checked;

  if (checkboxes.length < 2 || checkboxes.length > 4) {
    alert("Please select 2 to 4 lenses.");
    return;
  }

  const laserFee = addLaser ? 1100 : 0;
  const oraFee = addOra ? 500 : 0;

  const headers = checkboxes.map(cb => cb.dataset.name);

  const rows = {
    "Lens Type": checkboxes.map(cb => cb.dataset.type),
    "Vision goal": checkboxes.map(cb => cb.dataset.exp),
    "Pros": checkboxes.map(cb => cb.dataset.pros),
    "Cons": checkboxes.map(cb => cb.dataset.cons),
    "Other": checkboxes.map(() => {
      let parts = [];
      if (addLaser) parts.push("Laser");
      if (addOra) parts.push("ORA");
      return parts.join(" + ");
    }),
    "Cost above insurance": checkboxes.map(cb => {
      const name = cb.dataset.name;
      let base = basePrices[region][name] || "$0";
      let total = parseInt(base.replace(/\D/g, '')) + laserFee + oraFee;
      return total ? `$${total.toLocaleString()} per eye` : "$0";
    })
  };

  // Add Recommended row only if one is chosen
  if (recommendation) {
    const recommended = recommendation.value;
    rows["Recommended"] = checkboxes.map(cb => cb.dataset.name === recommended ? "⭐ Recommended" : "");
  }

  let html = `
    <div id="pdfContent">
      <div class="logo">
        <img src="logo.png" alt="Acuity Eye Group Logo" width="200">
        <h3>IOL Comparison Summary</h3>
        ${patientName ? `<p><strong>Patient:</strong> ${patientName}</p>` : ""}
      </div>
      <table>
        <thead>
          <tr><th>Attribute</th>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
        </thead>
        <tbody>
          ${Object.entries(rows).map(([label, values]) =>
            `<tr><td><strong>${label}</strong></td>${values.map(v => `<td>${v}</td>`).join('')}</tr>`
          ).join('')}
        </tbody>
      </table>
      ${notes ? `<p><strong>Notes:</strong> ${notes}</p>` : ""}
      <div class="no-print" style="margin-top:20px;">
        <button class="btn" onclick="downloadPDF()">Download PDF</button>
        <button class="btn" onclick="window.print()">Print</button>
      </div>
    </div>
  `;
  document.getElementById("comparisonContainer").innerHTML = html;
}

async function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape" });
  const pdfContent = document.getElementById("pdfContent");
  await doc.html(pdfContent, { callback: function(doc) { doc.save("IOL_Comparison.pdf"); }, x: 10, y: 10 });
}
</script>
</body>
</html>
